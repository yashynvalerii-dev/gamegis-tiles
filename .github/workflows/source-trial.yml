# Manual: check that one fallback source delivers a usable extract for one small region (counted in the journal).
name: source-trial
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'movisda | geo2day | osmfr'
        required: true
      region:
        description: 'Geofabrik-style path of a SMALL region, e.g. europe/germany/bremen'
        required: true
permissions:
  contents: write
concurrency:
  group: sources
  cancel-in-progress: false
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node tools/trySource.js "${{ inputs.source }}" "${{ inputs.region }}" --ledger source-usage.json
      - name: Save the source journal
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-usage.json; git diff --cached --quiet && exit 0
          git commit -qm "sources: usage journal (trial ${{ inputs.source }})"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
