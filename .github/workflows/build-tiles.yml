# Builds static tile bundles from the latest Geofabrik extract and publishes them on GitHub Pages.
# Runs weekly, on demand, and when the pipeline code changes.
name: build-tiles
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'site-template/**', '.github/workflows/build-tiles.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download extract (MD5 verified) and region boundary
        run: npm run download-extract
      - name: Export tile bundles
        run: npm run export-tiles -- --out site
      - name: Add landing page and summary
        run: |
          cp -r site-template/. site/
          node -e "
            const r=require('./site/export-report.json');
            const mb=b=>(b/1048576).toFixed(1)+' MB';
            const lines=['## Tile build','',
              '| | |','|---|---|',
              '| Bundles | '+r.bundles+' |','| Size | '+mb(r.bytes)+' raw / '+mb(r.gzipBytes)+' gzip |',
              '| Tiles READY | '+r.tiles.READY+' |','| Tiles INCOMPLETE | '+r.tiles.INCOMPLETE+' |',
              '| Time | '+r.totalSeconds.toFixed(0)+' s |','| Peak memory | '+r.maxRssMB+' MB |'];
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
