# Builds static tile bundles from the latest Geofabrik extract and publishes them on GitHub Pages.
# Runs weekly, on demand, and when the pipeline code changes.
# A build check compares each build with the published site; a broken build is not published (GitHub e-mails the owner).
name: build-tiles
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      accept:
        description: 'Publish even if the build check blocks it (after a human looked at build-check.json)'
        type: boolean
        default: false
  workflow_call:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'site-template/**', 'regions.json', 'requested-regions.json', '.github/workflows/build-tiles.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      TILES_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; upgrade after a test run
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # when called after a requests commit, build the newest main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download extracts (MD5 verified) and region boundaries
        run: |
          set -o pipefail
          mkdir -p diag
          npm run download-extract -- --config regions.json --config requested-regions.json 2>&1 | tee diag/download.log
      - name: Export tile bundles for all regions
        run: |
          set -o pipefail
          npm run export-tiles -- --config regions.json --config requested-regions.json --out site 2>&1 | tee diag/export.log
      - name: Check the build against the published site (blocks broken builds)
        run: |
          curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/export-report.json?v=${{ github.run_id }}" -o prev-report.json || echo "no previous report to compare"
          node tools/checkBuild.js --prev prev-report.json --next site/export-report.json --config regions.json --out site/build-check.json ${{ inputs.accept && '--accept' || '' }} | tee diag/build-check.json
      - name: Publish diagnostics on failure (branch ci-diagnostics)
        if: failure()
        run: |
          cp -r diag /tmp/diag; df -h > /tmp/diag/disk.txt; free -m > /tmp/diag/memory.txt
          echo "run ${{ github.run_id }} commit ${{ github.sha }} failedAt $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/diag/RUN.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -f --orphan ci-diagnostics; git rm -rqf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/diag/* .; git add -A; git commit -qm "diagnostics for run ${{ github.run_id }}"; git push -f origin ci-diagnostics
      - name: Add landing page and summary
        run: |
          cp -r site-template/. site/
          cp src/client/gamegis-client.js site/
          node -e "
            const r=require('./site/export-report.json');
            const mb=b=>(b/1048576).toFixed(1)+' MB';
            const lines=['## Tile build','','| Region | Bundles | Stored | READY | INCOMPLETE | Time |','|---|---|---|---|---|---|'];
            for (const g of r.regions) lines.push('| '+g.id+' | '+g.bundles+' | '+mb(g.storedBytes||0)+' | '+g.tiles.READY+' | '+g.tiles.INCOMPLETE+' | '+g.seconds.toFixed(0)+' s |');
            lines.push('','Total: '+r.bundles+' bundles, '+mb(r.storedBytes)+', '+r.totalSeconds.toFixed(0)+' s, peak '+r.maxRssMB+' MB');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n')+'\\n');"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Mirror to Cloudflare Pages (when its secrets are set; never blocks the main site)
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cdba4b4bb59eb5e8a710764c58ad94c1' }}   # account id is not a secret
        run: |
          # the account id is optional: with a single account wrangler finds it from the token
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npx --yes wrangler@4 pages project create gamegis-tiles --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy site --project-name gamegis-tiles --branch main --commit-dirty=true | tee /tmp/cf.log
          sleep 20
          want=$(sha256sum site/manifest.json | cut -d' ' -f1)
          got=$(curl -fsS "https://gamegis-tiles.pages.dev/manifest.json?v=${{ github.run_id }}" | sha256sum | cut -d' ' -f1 || true)
          if [ "$want" = "$got" ]; then echo "::notice::Cloudflare mirror matches this build"; else echo "::warning::Cloudflare mirror manifest differs (see deploy log for the real address)"; grep -o 'https://[^ ]*pages.dev[^ ]*' /tmp/cf.log | head -3 | sed 's/^/::notice::deployed to /'; fi
  deploy:
    needs: build
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; upgrade after a test run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
