# Manual diagnostic: what alternative OSM sources offer for our regions (listings, headers, checksums only).
name: sources-check
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          UA="GameGIS-Broker/0.1 (+https://github.com/yashynvalerii-dev/gamegis-tiles)"
          echo "== movisda home (usage notes)"
          curl -sS -A "$UA" --max-time 30 https://osm.download.movisda.io/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 4000; echo; sleep 2
          for u in europe/germany/thueringen-latest.osm.pbf europe/germany/thueringen-latest.osm.pbf.md5 europe/germany/thueringen.poly admin/DE-TH-latest.osm.pbf.md5 admin/DE-TH-latest.poly; do
            echo "== movisda HEAD $u"; curl -sSI -A "$UA" --max-time 30 "https://osm.download.movisda.io/$u" | grep -iE "^(HTTP|location|content-length|last-modified|etag|content-type)" ; sleep 2
          done
          echo "== geo2day germany links"
          curl -sS -A "$UA" --max-time 30 https://geo2day.com/europe/germany.html | grep -oE 'href="[^"]*(thueringen|thuringia|hessen|nordrhein)[^"]*"' | sort -u | head; sleep 2
          echo "== geo2day thueringen text"
          curl -sS -A "$UA" --max-time 30 https://geo2day.com/europe/germany.html | sed 's/<[^>]*>/ /g' | tr -s ' \n' | grep -oiE "Th(ue|ü)ringen[^]]*\][^)]*\)[^[]*\[[^]]*\]" | head -3; sleep 2
          for u in europe/germany/thueringen.pbf europe/germany/thueringen.poly europe/germany/thueringen.pbf.md5; do
            echo "== geo2day HEAD $u"; curl -sSI -A "$UA" --max-time 30 "https://geo2day.com/$u" | grep -iE "^(HTTP|location|content-length|last-modified|etag|content-type)"; sleep 2
          done
