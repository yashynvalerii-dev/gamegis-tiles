# Manual diagnostic: can the build machines reach Geofabrik? Tiny requests only (HEAD / small text files).
name: geofabrik-check
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          UA="GameGIS-Broker/diagnostic"
          echo "runner ip: $(curl -sS --max-time 10 https://api.ipify.org || echo unknown)"
          getent hosts download.geofabrik.de || echo "DNS failed"
          for u in https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf.md5 \
                   https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf; do
            echo "== $u"
            curl -sS -I -A "$UA" --max-time 30 -o /dev/null -w "http %{http_code} ip %{remote_ip} connect %{time_connect}s tls %{time_appconnect}s\n" "$u" || echo "curl exit $?"
          done
          echo "== redirect target"
          curl -sS -I -A "$UA" --max-time 30 https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf | grep -iE "^(HTTP|location|retry|x-)" || true
          LOC=$(curl -sS -I -A "$UA" --max-time 30 https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r')
          echo "location: $LOC"
          [ -n "$LOC" ] && { getent hosts "$(echo "$LOC" | sed -E 's#https?://([^/]+)/.*#\1#')" || echo "DNS of target failed"; curl -sS -I -A "$UA" --max-time 30 -o /dev/null -w "target http %{http_code} ip %{remote_ip} connect %{time_connect}s\n" "$LOC" || echo "target curl exit $?"; }
          echo "== node fetch"
          node -e "fetch('https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf',{method:'HEAD',headers:{'User-Agent':'$UA'}}).then(r=>console.log('node',r.status,r.url)).catch(e=>console.log('node error',e.message,e.cause?.code,e.cause?.message))"
          echo "== node fetch .md5 with different User-Agents"
          cat > /tmp/ua.mjs <<'JS'
          const url = 'https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf.md5';
          for (const ua of ['GameGIS-Broker/0.1 extract-download', 'GameGIS-Broker/diagnostic', null]) {
            try { const r = await fetch(url, ua ? {headers: {'user-agent': ua}} : {}); console.log(JSON.stringify(ua), r.status, (await r.text()).slice(0, 12)); }
            catch (e) { console.log(JSON.stringify(ua), 'ERROR', e.message, e.cause?.code, e.cause?.message); }
          }
          JS
          node /tmp/ua.mjs
          echo "== curl with the build User-Agent"
          curl -sS -A "GameGIS-Broker/0.1 extract-download" --max-time 30 -o /dev/null -w "http %{http_code}\n" https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf.md5 || echo "curl exit $?"
          echo "== verbose md5"
          curl -sS -v -A "$UA" --max-time 30 https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf.md5 2>&1 | grep -E "^\*|^< HTTP|^[0-9a-f]{32}" | head -30 || true
