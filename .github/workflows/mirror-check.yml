# Daily: the Cloudflare mirror must serve the same build as GitHub Pages (games may read the mirror first).
# A stale mirror fails this run, so GitHub e-mails the owner. Manual run also lists the Cloudflare Pages projects.
name: mirror-check
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Both copies serve the same build
        run: |
          node --input-type=module -e '
            const sites = ["https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/", "https://gamegis-tiles.pages.dev/"];
            const m = await Promise.all(sites.map(async s => { const r = await fetch(s + "manifest.json?t=" + Date.now(), {cache: "no-store"}); if (!r.ok) throw new Error(s + " HTTP " + r.status); return r.json(); }));
            const [a, b] = m.map(x => ({at: x.generatedAt, bundles: Object.keys(x.bundles ?? {}).length, regions: (x.regions ?? []).map(r => r.id).join(",")}));
            console.log("::notice::pages " + JSON.stringify(a) + " | mirror " + JSON.stringify(b));
            if (a.at !== b.at) { console.log("::error::Cloudflare mirror is stale: " + b.at + " vs " + a.at + " (run build-tiles manually)"); process.exit(1); }
          '
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: List Cloudflare Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cdba4b4bb59eb5e8a710764c58ad94c1' }}   # account id is not a secret
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npx --yes wrangler@4 pages project list > /tmp/p.txt 2>&1 || true
          sed -e 's/[│┌┐└┘├┤┬┴┼─]/ /g' /tmp/p.txt | grep -v '^\s*$' | tail -15 | while IFS= read -r l; do echo "::notice::$l"; done
