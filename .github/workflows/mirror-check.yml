# Manual: shows the Cloudflare Pages projects and their addresses (token from secrets; nothing secret is printed).
name: mirror-check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: List Cloudflare Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npx --yes wrangler@4 pages project list > /tmp/p.txt 2>&1 || true
          sed -e 's/[│┌┐└┘├┤┬┴┼─]/ /g' /tmp/p.txt | grep -v '^\s*$' | tail -15 | while IFS= read -r l; do echo "::notice::$l"; done
