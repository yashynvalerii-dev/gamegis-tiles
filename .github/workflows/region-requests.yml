# Every 3 hours: read region requests sent by games, add new regions within limits, rebuild the site if needed.
name: region-requests
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: region-requests
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; upgrade after a test run
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Last good copy of the Geofabrik region index: planning goes on when Geofabrik refuses this machine.
      - uses: actions/cache/restore@v4
        with:
          path: data/geofabrik-index.json
          key: geofabrik-index-${{ github.run_id }}
          restore-keys: geofabrik-index-
      - name: Report which optional secrets are set (values never printed)
        run: echo "::notice::secrets set - requests:${{ secrets.REQUESTS_CSV_URL != '' }} cloudflare-token:${{ secrets.CLOUDFLARE_API_TOKEN != '' }} cloudflare-account:${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}"
      - id: plan
        name: Plan regions from requests
        env:
          REQUESTS_CSV_URL: ${{ secrets.REQUESTS_CSV_URL }}
          REQUESTS_APPS: ${{ secrets.REQUESTS_APPS }}
          TILES_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p data
          node tools/processRequests.js --config regions.json --out requested-regions.json --index-cache data/geofabrik-index.json --ledger source-usage.json
      - name: Keep the fresh index copy (at most once a day)
        id: idxday
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        continue-on-error: true   # the key of today already exists after the first run of the day
        with:
          path: data/geofabrik-index.json
          key: geofabrik-index-${{ steps.idxday.outputs.day }}
      - name: Commit new regions / pinned usage (observation only, never rebuilds by itself)
        if: always() && steps.plan.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in requested-regions.json pinned-usage.json source-usage.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -qm "regions: requested regions / pinned usage / source journal"
          # main may have moved while planning (another commit): rebase onto it and retry
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    uses: ./.github/workflows/build-tiles.yml
    with:
      incremental: true   # only the new/changed areas; the weekly build stays full
    secrets: inherit   # the Cloudflare mirror token; without it request-driven builds left the mirror stale (2026-11-07)
